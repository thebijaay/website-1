<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/dev-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiran Pokhrel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Ovo&display=swap" rel="stylesheet">
  <style>
    :root {
      --gradient-bg: linear-gradient(135deg, #8e44ad, #ff6ec7, #00c6ff);
      --light-bg: #ffffff;
      --light-text: #000000;
      --dark-bg: #1a1a1a;
      --dark-text: #ffffff;
    }

    body {
      font-family: 'Outfit', sans-serif;
      line-height: 1.75;
      margin: 0;
      transition: all 0.5s ease;
    }

    /* LIGHT MODE GRADIENT */
    body:not(.dark-mode) {
      background: var(--gradient-bg);
      color: white; /* text stands out on gradient */
      background-clip: border-box;
    }

    /* DARK MODE */
    body.dark-mode {
      background: var(--dark-bg);
      color: var(--dark-text);
    }

    .theme-button {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #8e44ad;
      color: #fff;
      transition: background 0.3s ease;
    }

    .theme-button:hover {
      background: #ff6ec7;
    }
  </style>
</head>

<body>
  <button class="theme-button" id="themeButton">Toggle Dark Mode</button>

  <div id="root">
    <h1>Hello, Kiran!</h1>
    <p>Your site is now showing a gradient in light mode.</p>
  </div>

  <script>
    const themeButton = document.getElementById('themeButton');
    const body = document.body;

    themeButton.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
    });
  </script>
</body>

</html>
